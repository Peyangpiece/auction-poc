<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04052a" media="(prefers-color-scheme: dark)">
<title>ログイン｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="令和の競り">
<!-- impeccable-disable overused-font: Inter は、数字と英字のために決めてある書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#main">本文へ進む</a>
<header class="brandbar">
  <div>
    <a class="brand" href="/" translate="no">
      <picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img class="brand__logo" src="logo.svg" width="178" height="48" alt="令和の競り（株式会社レイワ）"></picture>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main id="main" tabindex="-1" class="narrow">
<div class="pagehead">
  <h1>ログイン</h1>
  <hr class="rule">
</div>
<form class="form" id="pwForm" novalidate>
  <label class="field">ログイン ID
    <input class="input" name="loginId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <span class="err" role="alert"></span>
  </label>
  <label class="field">パスワード
    <input class="input" name="password" type="password" autocomplete="current-password" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions"><button class="btn btn-primary btn-lg" type="submit">ログイン</button></div>
  <p class="aside"><button class="textbtn" type="button" id="forgot">パスワードを忘れた方</button></p>
</form>
<form class="form" id="stepPhone" novalidate hidden>
  <p class="note">登録した携帯電話の番号か、メールアドレスに、認証番号をお送りします。ログインのあと、マイページで、新しいパスワードを決めてください。</p>
  <label class="field">携帯電話の番号 または メールアドレス
    <input class="input" name="id" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="090-1234-5678 / taro@example.com" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions"><button class="btn btn-primary btn-lg" type="submit">認証番号を送る</button></div>
  <p class="aside"><button class="textbtn" type="button" id="backToPw">ログイン ID とパスワードでログインする</button></p>
</form>
<form class="form" id="stepCode" novalidate hidden>
  <label class="field">認証番号（6桁）
    <small id="sentTo"></small>
    <input class="input code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions">
    <button class="btn btn-primary btn-lg" type="submit">ログイン</button>
    <button class="btn btn-lg" type="button" id="resend">送り直す</button>
  </div>
</form>
<p class="aside small">会員登録がお済みでない方は <a href="/register.html">会員登録</a></p>
</main>
<footer class="sitefoot">
  <p translate="no">株式会社レイワ</p>
  <nav aria-label="規約"><a href="/legal.html#terms">利用規約</a><a href="/legal.html#tokushoho">特定商取引法に基づく表示</a><a href="/legal.html#privacy">プライバシーポリシー</a></nav>
</footer>
<script src="site.js"></script>
<script src="login.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04052a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>マイページ｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<!-- impeccable-disable overused-font: Inter は、数字と英字のために決めてある書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="brandbar">
  <div>
    <a class="brand" href="/">
      <img src="emblem-120.webp" width="40" height="40" alt="">
      <span class="brand__text"><span class="brand__name">株式会社レイワ</span><span class="brand__service">令和の競り</span></span>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main class="narrow">
<div class="pagehead">
  <h1>マイページ</h1>
  <hr class="rule">
</div>
<div class="banner" id="suspended" role="alert" hidden><span>ご利用を停止しています。会場の受付にお問い合わせください。</span></div>
<div class="banner" id="emailBanner" hidden>

  <button class="btn" type="button" id="resendEmail">確認メールを送り直す</button>
</div>
<p class="msg ok" id="notice" role="status"></p>
<div class="lead"><div class="actions"><a class="btn btn-primary btn-lg" href="/bidder.html">競りに参加する</a></div></div>
<section id="billing" hidden>
  <h2 class="subhead">落札した品とお支払い</h2>
  <div id="offers"></div>
  <ul class="rows mylines dyn" id="myLines"></ul>
</section>
<h2 class="subhead">ご登録の内容</h2>
<dl class="facts" id="facts"></dl>
</main>
<script src="site.js"></script>
<script src="mypage.js"></script>

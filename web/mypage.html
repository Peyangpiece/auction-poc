<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04052a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>マイページ｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="令和の競り">
<!-- impeccable-disable overused-font: Inter は、数字と英字のために決めてある書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body class="app">
<a class="skip" href="#main">本文へ進む</a>
<header class="brandbar">
  <div>
    <a class="brand" href="/" translate="no">
      <picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img class="brand__logo" src="logo.svg" width="178" height="48" alt="令和の競り（株式会社レイワ）"></picture>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main id="main" tabindex="-1" class="narrow">
<div class="pagehead">
  <h1>マイページ</h1>
  <hr class="rule">
</div>
<div class="banner" id="suspended" role="alert" hidden><span>ご利用を停止しています。会場の受付にお問い合わせください。</span></div>
<div class="banner" id="emailBanner" hidden>
  <span id="emailText">メールアドレスの確認が済んでいません。</span>
  <button class="btn" type="button" id="resendEmail">確認メールを送り直す</button>
</div>
<p class="msg ok" id="notice" role="status"></p>
<div class="lead" id="goBid"><div class="actions"><a class="btn btn-primary btn-lg" href="/bidder.html">競りに参加する</a></div></div>
<div class="tabs" role="tablist" aria-label="マイページ" id="myTabs">
  <button type="button" role="tab" id="tab-bills" data-tab="bills" aria-controls="panel-bills" aria-selected="true">請求書</button>
  <button type="button" role="tab" id="tab-profile" data-tab="profile" aria-controls="panel-profile" aria-selected="false">個人情報の設定</button>
</div>
<section id="panel-bills" role="tabpanel" aria-labelledby="tab-bills">
  <div class="card" id="invoices"><p class="empty">請求書は、まだありません。</p></div>
  <section class="card" id="billing" hidden>
    <h2 class="subhead">落札した品</h2>
    <div id="offers"></div>
    <ul class="rows mylines dyn" id="myLines"></ul>
  </section>
</section>
<section id="panel-profile" role="tabpanel" aria-labelledby="tab-profile" hidden>
  <dl class="facts card" id="facts"></dl>
  <ul class="menu card">
    <li><button type="button" id="editBtn">登録内容を変更する</button></li>
    <li><button type="button" id="pwBtn">パスワードを変更する</button></li>
    <li><button type="button" id="logoutBtn">ログアウト</button></li>
  </ul>
  <ul class="menu card">
    <li><label class="menu__switch" for="eventMail"><span>開催のお知らせメール<small>開催の前日に、日時と会場をお送りします</small></span><input type="checkbox" role="switch" id="eventMail"></label></li>
  </ul>
  <p class="msg" id="accountMsg" role="alert"></p>
  <div id="installSlot"></div>
  <ul class="menu card">
    <li><a href="/legal.html#terms">利用規約</a></li>
    <li><a href="/legal.html#privacy">プライバシーポリシー</a></li>
    <li><a href="/legal.html#tokushoho">特定商取引法に基づく表示</a></li>
    <li><button type="button" class="menu__quiet" id="withdrawBtn">退会の手続き</button></li>
  </ul>
</section>
<dialog class="wide" id="dlg"></dialog>
</main>
<footer class="sitefoot">
  <p translate="no">株式会社レイワ</p>
  <nav aria-label="規約"><a href="/legal.html#terms">利用規約</a><a href="/legal.html#tokushoho">特定商取引法に基づく表示</a><a href="/legal.html#privacy">プライバシーポリシー</a></nav>
</footer>
<script src="site.js"></script>
<script src="mypage.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04052a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>管理｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<!-- impeccable-disable overused-font: Inter は、数字と英字のために決めてある書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="brandbar">
  <div>
    <a class="brand" href="/">
      <picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img class="brand__logo" src="logo.svg" width="178" height="48" alt="令和の競り（株式会社レイワ）"></picture>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main>
<section id="login" hidden>
  <div class="pagehead"><h1>スタッフ ログイン</h1><hr class="rule"></div>
  <form class="form" id="loginForm" novalidate>
    <label class="field">ログイン ID<input class="input" name="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required><span class="err" role="alert"></span></label>
    <label class="field">パスワード<input class="input" name="password" type="password" autocomplete="current-password" required><span class="err" role="alert"></span></label>
    <label class="field">認証コード（6桁）<small>認証アプリに表示される番号</small><input class="input code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><span class="err" role="alert"></span></label>
    <p class="msg" role="alert" tabindex="-1"></p>
    <div class="actions"><button class="btn btn-primary btn-lg" type="submit">ログイン</button></div>
  </form>
</section>
<section id="app" hidden>
  <div class="toolbar"><div class="pagehead"><h1>管理</h1><p id="who"></p></div><a class="btn btn-primary" id="toConsole" href="/console.html" hidden>進行コンソールを開く</a></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel" role="tabpanel"></div>
</section>
<dialog class="wide" id="dlg"></dialog>
</main>
<script src="site.js"></script>
<script src="staff.js"></script>
</body>
</html>

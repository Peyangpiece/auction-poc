<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>管理｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="令和の競り">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#main">本文へ進む</a>
<header class="brandbar">
  <div>
    <a class="brand" href="/" translate="no">
      <picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img class="brand__logo" src="logo.svg" width="178" height="48" alt="令和の競り（株式会社レイワ）"></picture>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main id="main" tabindex="-1">
<section id="login" hidden>
  <div class="pagehead"><h1>スタッフ ログイン</h1><hr class="rule"></div>
  <form class="form" id="loginForm" novalidate>
    <label class="field">メールアドレス<input class="input" name="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required><span class="err"></span></label>
    <label class="field">パスワード<input class="input" name="password" type="password" autocomplete="current-password" required><span class="err"></span></label>
    <p class="msg" role="alert" tabindex="-1"></p>
    <div class="actions"><button class="btn btn-primary btn-lg" type="submit">ログイン</button></div>
    <p class="aside"><button class="textbtn" type="button" id="firstTime">はじめての方（パスワードを決める）</button></p>
  </form>
  <form class="form" id="setupForm" novalidate hidden>
    <label class="field">メールアドレス<input class="input" name="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required><span class="err"></span></label>
    <label class="field">新しいパスワード<input class="input" name="password" type="password" autocomplete="new-password" placeholder="12文字以上" required><span class="err"></span></label>
    <label class="field">新しいパスワード（もう一度）<input class="input" name="password2" type="password" autocomplete="new-password" required><span class="err"></span></label>
    <p class="msg" role="alert" tabindex="-1"></p>
    <div class="actions"><button class="btn btn-primary btn-lg" type="submit">パスワードを決めて、ログインする</button></div>
    <p class="aside"><button class="textbtn" type="button" id="backToLogin">ログインに戻る</button></p>
  </form>
</section>
<section id="app" hidden>
  <div class="toolbar"><div class="pagehead"><h1>管理</h1><p id="who"></p></div><div><a class="btn" id="toMonitor" href="/monitor.html" hidden>会場モニターを開く</a> <a class="btn" id="toCaller" href="/caller.html" hidden>オークショニア画面を開く</a> <a class="btn btn-primary" id="toConsole" href="/console.html" hidden>進行コンソールを開く</a></div></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel" role="tabpanel" tabindex="-1"></div>
</section>
<dialog class="wide" id="dlg" aria-labelledby="dlgTitle"></dialog>
</main>
<script src="site.js"></script>
<script src="staff.js"></script>
</body>
</html>

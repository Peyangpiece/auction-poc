<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1028" media="(prefers-color-scheme: dark)">
<title>出品カタログ｜株式会社NEWS ライブオークション</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<!-- impeccable-disable overused-font: Inter は News-HP（株式会社NEWS のサイト）で決まっている数字用の書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="brandbar">
  <div>
    <a class="brand" href="/">
      <img src="emblem-120.webp" width="40" height="40" alt="">
      <span class="brand__text"><span class="brand__name">株式会社NEWS</span><span class="brand__service">ライブオークション</span></span>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main>
<div class="pagehead">
  <h1>出品カタログ</h1>
  <hr class="rule">
</div>
<div id="events" aria-live="polite"></div>
<section class="terms" id="terms" hidden>
  <div><h2>送料</h2><p class="pre dyn" id="shipping"></p></div>
  <div><h2>返品</h2><p class="pre dyn" id="returns"></p></div>
</section>
<dialog class="wide" id="detail" aria-labelledby="detailTitle">
  <p class="no" id="detailNo"></p>
  <h2 class="dyn" id="detailTitle"></h2>
  <div id="detailHero"></div>
  <div class="gallery" id="detailThumbs"></div>
  <dl class="facts" id="detailFacts"></dl>
  <div class="actions"><button class="btn" type="button" id="detailClose">閉じる</button></div>
</dialog>
</main>
<script src="site.js"></script>
<script src="catalog.js"></script>
</body>
</html>

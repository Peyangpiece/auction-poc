<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1028" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>マイページ｜株式会社NEWS ライブオークション</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<!-- impeccable-disable overused-font: Inter は News-HP（株式会社NEWS のサイト）で決まっている数字用の書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="brandbar">
  <div>
    <a class="brand" href="/">
      <img src="emblem-120.webp" width="40" height="40" alt="">
      <span class="brand__text"><span class="brand__name">株式会社NEWS</span><span class="brand__service">ライブオークション</span></span>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main class="narrow">
<div class="pagehead">
  <h1>マイページ</h1>
  <hr class="rule">
</div>
<div class="banner" id="suspended" role="alert" hidden><span>ご利用を停止しています。会場の受付にお問い合わせください。</span></div>
<div class="banner" id="emailBanner" hidden>
  <span id="emailText">メールアドレスの確認が済んでいません。</span>
  <button class="btn" type="button" id="resendEmail">確認メールを送り直す</button>
</div>
<p class="msg ok" id="notice" role="status"></p>
<dl class="facts" id="facts"></dl>
</main>
<script src="site.js"></script>
<script src="mypage.js"></script>
</body>
</html>

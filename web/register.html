<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04052a" media="(prefers-color-scheme: dark)">
<title>会員登録｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<!-- impeccable-disable overused-font: Inter は、数字と英字のために決めてある書体 -->
<link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="brandbar">
  <div>
    <a class="brand" href="/">
      <picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img class="brand__logo" src="logo.svg" width="178" height="48" alt="令和の競り（株式会社レイワ）"></picture>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main class="narrow">
<div class="pagehead">
  <h1>会員登録</h1>
  <hr class="rule">
</div>
<ol class="steps" id="steps">
  <li data-n="1" aria-current="step">電話番号</li>
  <li data-n="2">認証番号</li>
  <li data-n="3">お客様の情報</li>
</ol>

<form class="form" id="stepPhone" novalidate>
  <label class="field">携帯電話の番号
    <small>SMS で認証番号を送ります</small>
    <input class="input" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="090-1234-5678" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions"><button class="btn btn-primary btn-lg" type="submit">認証番号を送る</button></div>
</form>

<form class="form" id="stepCode" novalidate hidden>
  <label class="field">認証番号（6桁）
    <small id="sentTo"></small>
    <input class="input code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions">
    <button class="btn btn-primary btn-lg" type="submit">確認する</button>
    <button class="btn btn-lg" type="button" id="resend">送り直す</button>
  </div>
</form>

<form class="form" id="stepProfile" novalidate hidden>
  <fieldset class="choice">
    <legend>ご利用の区分</legend>
    <label><input type="radio" name="kind" value="b2c" checked>個人</label>
    <label><input type="radio" name="kind" value="b2b">法人</label>
    <span class="err" role="alert"></span>
  </fieldset>
  <div class="form" id="corp" hidden>
    <label class="field">会社名<input class="input" name="company" autocomplete="organization"><span class="err" role="alert"></span></label>
    <label class="field">担当者名<input class="input" name="contactName" autocomplete="off"><span class="err" role="alert"></span></label>
    <label class="field">請求先<small>請求書の宛名と送り先</small><textarea class="input" name="billing" rows="2"></textarea><span class="err" role="alert"></span></label>
  </div>
  <label class="field">氏名<input class="input" name="name" autocomplete="name" required><span class="err" role="alert"></span></label>
  <label class="field">メールアドレス<input class="input" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" required><span class="err" role="alert"></span></label>
  <label class="field">住所<textarea class="input" name="address" rows="2" autocomplete="street-address" required></textarea><span class="err" role="alert"></span></label>
  <label class="field">配送先<small>住所と違う場合だけ</small><textarea class="input" name="shipTo" rows="2"></textarea><span class="err" role="alert"></span></label>
  <label class="check" id="adultRow"><input type="checkbox" name="adult" value="1"><span>18歳以上です<span class="err" role="alert"></span></span></label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions"><button class="btn btn-primary btn-lg" type="submit">登録する</button></div>
</form>
<p class="aside">登録済みの方は <a href="/login.html">ログイン</a></p>
</main>
<script src="site.js"></script>
<script src="register.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04052a" media="(prefers-color-scheme: dark)">
<title>会員登録｜令和の競り</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="令和の競り">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#main">本文へ進む</a>
<header class="brandbar">
  <div>
    <a class="brand" href="/" translate="no">
      <picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img class="brand__logo" src="logo.svg" width="178" height="48" alt="令和の競り（株式会社レイワ）"></picture>
    </a>
    <nav id="nav" aria-label="メニュー"></nav>
  </div>
</header>
<main id="main" tabindex="-1" class="narrow">
<div class="pagehead">
  <h1>会員登録</h1>
  <hr class="rule">
</div>
<ol class="steps" id="steps">
  <li data-n="1" aria-current="step">連絡先</li>
  <li data-n="2">認証番号</li>
  <li data-n="3">お客様の情報</li>
</ol>

<form class="form" id="stepPhone" novalidate>
  <label class="field">携帯電話の番号 または メールアドレス
    <small>認証番号をお送りします</small>
    <input class="input" name="id" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="090-1234-5678 / taro@example.com" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions"><button class="btn btn-primary btn-lg" type="submit">認証番号を送る</button></div>
</form>

<form class="form" id="stepCode" novalidate hidden>
  <label class="field">認証番号（6桁）
    <small id="sentTo"></small>
    <input class="input code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    <span class="err" role="alert"></span>
  </label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions">
    <button class="btn btn-primary btn-lg" type="submit">確認する</button>
    <button class="btn btn-lg" type="button" id="resend">送り直す</button>
  </div>
</form>

<form class="form" id="stepProfile" novalidate hidden>
  <fieldset class="choice">
    <legend>ご利用の区分</legend>
    <label><input type="radio" name="kind" value="b2c" checked>個人</label>
    <label><input type="radio" name="kind" value="b2b">法人</label>
    <span class="err" role="alert"></span>
  </fieldset>
  <div class="form" id="corp" hidden>
    <label class="field"><span class="field__label">会社名<span class="req">必須</span></span><input class="input" name="company" autocomplete="organization"><span class="err" role="alert"></span></label>
    <label class="field"><span class="field__label">担当者名<span class="req">必須</span></span><input class="input" name="contactName" autocomplete="off"><span class="err" role="alert"></span></label>
    <label class="field"><span class="field__label">請求先<span class="req">必須</span></span><small>請求書の宛名と送り先</small><textarea class="input" name="billing" rows="2" autocomplete="off"></textarea><span class="err" role="alert"></span></label>
  </div>
  <label class="field" id="phoneRow" hidden><span class="field__label">携帯電話の番号<span class="req">必須</span></span><small>当日のご連絡と、配送に使います</small><input class="input" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="090-1234-5678" disabled required><span class="err" role="alert"></span></label>
  <p class="verified" id="verifiedEmail" hidden></p>
  <label class="field" id="emailRow"><span class="field__label">メールアドレス<span class="req">必須</span></span><small>請求書やお知らせをお送りします</small><input class="input" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" required><span class="err" role="alert"></span></label>
  <div class="form" id="person"></div>
  <label class="check"><input type="checkbox" id="shipSame" checked><span>配送先は、上の住所と同じ</span></label>
  <label class="field" id="shipRow" hidden><span class="field__label">配送先<span class="opt">任意</span></span><small>郵便番号から、建物名まで</small><textarea class="input" name="shipTo" rows="3" autocomplete="off"></textarea><span class="err" role="alert"></span></label>
  <label class="check" id="adultRow"><input type="checkbox" name="adult" value="1"><span>18歳以上です<span class="err" role="alert"></span></span></label>
  <label class="check" id="agreeRow" hidden><input type="checkbox" name="agreed" value="1"><span><a href="/legal.html#terms" target="_blank" rel="noopener">利用規約</a>と<a href="/legal.html#privacy" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します<span class="err" role="alert"></span></span></label>
  <p class="msg" role="alert" tabindex="-1"></p>
  <div class="actions"><button class="btn btn-primary btn-lg" type="submit">登録する</button></div>
</form>
<section id="stepDone" hidden tabindex="-1">
  <h2 class="subhead">登録を受け付けました</h2>
  <p>主催者が内容を確認します。承認されると、<b>ログイン ID とパスワード</b>を、メールでお送りします。届いたら、ログインしてください。</p>
  <p class="note" id="doneMail"></p>
  <div class="lead"><div class="actions"><a class="btn" href="/login.html">ログインの画面へ</a></div></div>
</section>
<p class="aside">登録済みの方は <a href="/login.html">ログイン</a></p>
</main>
<footer class="sitefoot">
  <p translate="no">株式会社レイワ</p>
  <nav aria-label="規約"><a href="/legal.html#terms">利用規約</a><a href="/legal.html#tokushoho">特定商取引法に基づく表示</a><a href="/legal.html#privacy">プライバシーポリシー</a></nav>
</footer>
<script src="site.js"></script>
<script src="register.js"></script>
</body>
</html>
